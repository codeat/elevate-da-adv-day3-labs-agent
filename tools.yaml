# Cloud Bigtable MCP Toolbox configuration.
#
# PORTABILITY CONTRACT: no environment-specific identifier is committed here.
# `${PROJECT_ID}` / `${BIGTABLE_INSTANCE}` are substituted at deploy time by
# `make mcp-config` before the manifest is pushed to Secret Manager, so the same
# file promotes cleanly across dev / staging / prod.
#
# NAMING CONTRACT (Blueprint Section 3.2): tool identifiers follow
# `read_<table>_sql`, mirroring the underlying Bigtable table they project.
sources:
  bigtable-source:
    kind: bigtable
    project: ${PROJECT_ID}
    instance: ${BIGTABLE_INSTANCE}

tools:
  # -------------------------------------------------------------------------
  # Real-time cashier alert stream (table: cashier_realtime_alerts)
  # -------------------------------------------------------------------------
  read_cashier_realtime_alerts_sql:
    kind: bigtable-sql
    source: bigtable-source
    description: |
      Query live 1-hour rolling metrics, audit status flags, transaction counts, manual override counts, and promo rates for a cashier from Cloud Bigtable.
      Accepts a cashier row key prefix, such as 'STORE_048#CASH_1190' or 'STORE_001#CASH_1001'.
      Returns audit status, 1-hour transaction count, 1-hour manual override count, 1-hour promo rate, 1-hour total discount, 1-hour average discount percentage, risk score, and calculated live override rate.
      Use this for live intraday risk evaluation and for comparison against the 7-day historical baseline retrieved from BigQuery.
    statement: |
      SELECT
        CAST(_key AS STRING) as row_key,
        CAST(flags['audit_status'] AS STRING) as audit_status,
        CAST(stats['last_event_ts'] AS STRING) as last_event_ts,
        TO_FLOAT64(stats['cashier_1h_avg_discount_pct']) as avg_discount_pct,
        TO_INT64(stats['cashier_1h_manual_override_count']) as manual_override_count,
        TO_INT64(stats['cashier_1h_promo_count']) as promo_count,
        TO_FLOAT64(stats['cashier_1h_promo_rate']) as promo_rate,
        TO_FLOAT64(stats['cashier_1h_total_discount_usd']) as total_discount_usd,
        TO_INT64(stats['cashier_1h_txn_count']) as txn_count,
        TO_FLOAT64(stats['risk_score']) as risk_score,
        CASE
          WHEN TO_INT64(stats['cashier_1h_txn_count']) > 0
          THEN ROUND(CAST(TO_INT64(stats['cashier_1h_manual_override_count']) AS FLOAT64) / CAST(TO_INT64(stats['cashier_1h_txn_count']) AS FLOAT64), 4)
          ELSE 0.0
        END as live_override_rate
      FROM cashier_realtime_alerts
      WHERE CAST(_key AS STRING) LIKE CONCAT(@prefix, '%')
      ORDER BY _key ASC
      LIMIT 1;
    parameters:
      - name: prefix
        type: string
        description: "Row key prefix for the cashier, e.g. 'STORE_048#CASH_1190'"

  # -------------------------------------------------------------------------
  # Enriched POS transaction stream (table: pos_transactions_enriched)
  # -------------------------------------------------------------------------
  read_pos_transactions_enriched_sql:
    kind: bigtable-sql
    source: bigtable-source
    description: |
      Query enriched real-time POS checkout transactions streamed into Cloud Bigtable, including line item totals, applied discounts, promo codes, manual discount flags, tender type, payment network, and the Vertex AI order-anomaly inference verdict.
      The row key is 'STORE_<id>#TXN-<transaction id>', so `prefix` selects a STORE (e.g. 'STORE_048#') or one exact transaction key. It cannot select a cashier: use `prefix='STORE_048#'` together with `cashier_id='CASH_1190'` to drill into one cashier's checkouts. Pass cashier_id='' to return the whole store.
      Use this to inspect the individual transactions behind an elevated override rate or promo abuse alert, and to reconcile live checkout activity against the BigQuery gold ledger.
    statement: |
      SELECT
        CAST(_key AS STRING) as row_key,
        CAST(tx['transaction_id'] AS STRING) as transaction_id,
        CAST(tx['store_id'] AS STRING) as store_id,
        CAST(tx['cashier_id'] AS STRING) as cashier_id,
        CAST(tx['pos_terminal_id'] AS STRING) as pos_terminal_id,
        CAST(tx['business_date'] AS STRING) as business_date,
        CAST(tx['event_timestamp'] AS STRING) as event_timestamp,
        CAST(tx['payment_method'] AS STRING) as payment_method,
        CAST(tx['payment_network'] AS STRING) as payment_network,
        CAST(tx['promo_code_applied'] AS STRING) as promo_code_applied,
        CAST(tx['manual_discount_flag'] AS STRING) as manual_discount_flag,
        SAFE_CAST(CAST(tx['item_count'] AS STRING) AS INT64) as item_count,
        SAFE_CAST(CAST(tx['subtotal_amount'] AS STRING) AS FLOAT64) as subtotal_amount_usd,
        SAFE_CAST(CAST(tx['discount'] AS STRING) AS FLOAT64) as discount_amount_usd,
        SAFE_CAST(CAST(tx['tax_amount'] AS STRING) AS FLOAT64) as tax_amount_usd,
        SAFE_CAST(CAST(tx['total'] AS STRING) AS FLOAT64) as total_amount_usd,
        CAST(alerts['is_order_anomaly'] AS STRING) as is_order_anomaly,
        CAST(alerts['order_anomaly_alert_id'] AS STRING) as anomaly_alert_id,
        CAST(alerts['order_anomaly_alert_source'] AS STRING) as anomaly_alert_source,
        CAST(alerts['order_anomaly_alert_ts'] AS STRING) as anomaly_alert_ts,
        SAFE_CAST(CAST(alerts['order_anomaly_risk_score'] AS STRING) AS FLOAT64) as anomaly_risk_score
      FROM pos_transactions_enriched
      WHERE CAST(_key AS STRING) LIKE CONCAT(@prefix, '%')
        AND (@cashier_id = '' OR CAST(tx['cashier_id'] AS STRING) = @cashier_id)
      ORDER BY _key DESC
      LIMIT @row_limit;
    parameters:
      - name: prefix
        type: string
        description: "Row key prefix. Store scope 'STORE_048#', or one exact key 'STORE_048#TXN-20260910-0002205'. A cashier id is NOT part of the row key."
      - name: cashier_id
        type: string
        description: "Optional cashier filter applied to tx['cashier_id'], e.g. 'CASH_1190'. Pass an empty string to return every cashier in the prefix."
      - name: row_limit
        type: integer
        description: "Maximum number of transactions to return (recommended 10-50)"
