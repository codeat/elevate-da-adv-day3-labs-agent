[project]
name = "cymbal-operations-agent"
version = "1.1.0"
description = "Cymbal Retail Operations & Analytics Coordinator Agent (ADK hub-and-spoke)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "app/.adk"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["E501", "S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
# S608: rag_tool.py interpolates ONLY a fully-qualified BigQuery table identifier
# that is composed from trusted configuration. BigQuery cannot bind identifiers as
# query parameters, and every user-supplied value travels as a ScalarQueryParameter.
"app/tools/rag_tool.py" = ["S608"]
