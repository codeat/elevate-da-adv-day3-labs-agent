# =============================================================================
# Cymbal Retail Operations Agent - Evaluation Configuration (CORE / single-turn)
# =============================================================================
# Consumed by `agents-cli eval grade` / `agents-cli eval run` (this is the CLI's
# default config path, tests/eval/eval_config.yaml).
#
# SCHEMA (google/agents/cli/eval/eval_utils.py::load_eval_config):
#   metrics_to_run : list[str]  - metrics executed this run, by name.
#   custom_metrics : list[dict] - definitions for any name above that is not a
#                                 managed Vertex AI metric. `execution: local`
#                                 compiles `custom_function_file` in-process and
#                                 calls `evaluate(instance) -> {score, explanation}`.
#                                 Paths resolve relative to THIS file's directory.
#
# -----------------------------------------------------------------------------
# WHY THREE CONFIGS AND NOT ONE
# -----------------------------------------------------------------------------
# `agents-cli eval run --dataset` is single-valued, and the managed judges are
# not interchangeable across case shapes. Applying one metric set to every case
# produced 13 hard failures in an earlier run, none of which were agent defects:
#
#   * Single-turn judges reject multi-turn traces outright ---------------------
#       400 INVALID_ARGUMENT: "Single-turn metric 'tool_use_quality_v1' received
#       agent_eval_data with 2 turns."
#   * grounding_v1 cannot render against a correct refusal ---------------------
#       400 INVALID_ARGUMENT: "Variable context is required but not provided."
#       A guardrail case is *supposed* to invoke no tool, so there is no
#       retrieved span to attribute sentences to.
#   * instruction_following_v1 punishes correct refusals -----------------------
#       It auto-derives its rubric from the user prompt, so for
#       guard_01 it asked "Does the response provide information about a
#       warranty policy for a Tesla Model 3?" and scored the contractually
#       mandated decline 0.0.
#
# The suite is therefore partitioned by case shape, each with the instrument
# that is actually valid for it:
#
#   eval_config.yaml            <- datasets/eval-data.json   (6 in-scope, 1 turn)
#   eval_config.multiturn.yaml  <- datasets/eval-data2.json  (3 conversations)
#   eval_config.guardrails.yaml <- datasets/eval-data3.json  (4 adversarial)
#
# -----------------------------------------------------------------------------
# METRIC SELECTION RATIONALE (see evaluation_report.md Section 2)
# -----------------------------------------------------------------------------
# Two instruments with different costs and different failure modes:
#
#   * Managed Vertex AI judges  -> open-ended, semantic axes where "correct" is a
#     spectrum and no reference string exists (did it pick the right gateway?
#     is every sentence attributable to a retrieved span?).
#
#   * Deterministic local code  -> contractual invariants where "correct" is
#     string identity or a trace property. An LLM judge would award partial
#     credit to a well-phrased violation, which is exactly the regression class
#     these guard against. They also cost zero tokens and never flake, so they
#     are carried by ALL THREE configs as an always-on invariant floor.
# =============================================================================

metrics_to_run:
  # --- Managed Vertex AI judges (billed, semantic) --------------------------
  - tool_use_quality_v1 # Gateway routing, argument fidelity, dispatch ordering.
  - grounding_v1 # Sentence-level attribution to retrieved spans.
  - instruction_following_v1 # RULE ZERO grounding contract + output formatting.

  # --- Deterministic local guardrails (free, exact) -------------------------
  - decline_contract_compliance # Blueprint 2.3 verbatim out-of-scope decline.
  - pii_leakage_absent # Global: no issuer-prefixed, Luhn-valid PAN.
  - clarification_before_unbounded_scan # Blueprint 4.2 blast-radius control.
  - read_only_posture_upheld # Read-only gateways, explicit refusal.

custom_metrics:
  - name: decline_contract_compliance
    execution: local
    custom_function_file: metrics/decline_contract_compliance.py

  - name: pii_leakage_absent
    execution: local
    custom_function_file: metrics/pii_leakage_absent.py

  - name: clarification_before_unbounded_scan
    execution: local
    custom_function_file: metrics/clarification_before_unbounded_scan.py

  - name: read_only_posture_upheld
    execution: local
    custom_function_file: metrics/read_only_posture_upheld.py
